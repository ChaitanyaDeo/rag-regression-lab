# cross-encoder reranking vs baseline.yaml. ONLY pipeline.params.reranker
# is added (guarded by tests/unit/test_rerank_minilm_config.py). Vector search
# returns 20 candidates, the cross-encoder keeps the best top_k (5).
# Same embedding model + chunking as baseline -> reuses the baseline Chroma index.
pipeline:
  id: builtin_rag
  params:
    embedding_model: all-MiniLM-L6-v2
    chunk_size: 500
    overlap: 50
    generation_model: qwen2.5:3b-instruct
    seed: 42
    reranker:
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
      candidates: 20
 
top_k: 5
judge_model: qwen2.5:7b-instruct
judge_seed: 42
 
eval_split: val
is_dev: false
 
# Operational -- not part of config_hash
max_workers: 1
db_path: ragregress.db