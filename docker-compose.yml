# RAG Regression Lab in containers Run from the repo root.
#
# The API (B4): `docker compose up` serves it at http://127.0.0.1:8000 (docs at /docs), on this machine only.
#
#   docker compose build
#   docker compose up -d                      # start the API
#   docker compose ps                         # STATUS shows (healthy) once /health answers
#   docker compose logs -f api
#   docker compose down                       # stop it (add -v to also delete the two named volumes)
#
# The CLI (B2b) is the same image. Its service is under the `cli` profile, so `up` does not start it,
# but `run` still works:
#
#   docker compose run --rm ragregress --help
#   docker compose run --rm ragregress run --config configs/baseline.yaml --dry-run
#   docker compose run --rm ragregress compare --baseline <id> --candidate <id>
#   docker compose run --rm ragregress report --baseline <id> --candidate <id> --targets configs/targets/squad_val.yaml
#   docker compose run --rm --entrypoint python ragregress scripts/check_ollama.py
#   docker compose run --rm --entrypoint python ragregress scripts/make_lock.py     # writes requirements.lock
#
# Where things live (both services):
#   repo root  -> /work                 data/, configs/, ragregress.db, artifacts/logs, reports/ (on your disk)
#   chroma_index (named volume)         /work/artifacts/chroma: the vector index, rebuilt on first use
#   hf_cache (named volume)             /hf-cache: downloaded embedding / reranker models
#   Ollama                              on the host, reached through host.docker.internal
#
# Notes
#   - The API listens on 0.0.0.0 INSIDE the container (it must, to be reachable) but the port is published on
#     127.0.0.1 only: nothing else on your network can reach it. There is no authentication; keep it that way.
#   - Only one run at a time: POST /runs answers 409 while another run (from the API) is in progress.
#     The guard does not see a run started by the CLI. Stopping the container stops a run in progress.
#   - The healthcheck calls /health, which always answers 200 while the API is up (even with Ollama down).
#     /health itself may take a few seconds when Ollama is unreachable, hence the generous timeout.
#   - `report --open` cannot open a browser from a container: open reports\*.html on your machine.
#   - .env in the repo root is read as usual (JUDGE_API_KEY, LOG_LEVEL, ...). OLLAMA_HOST is
#     set below and wins over .env. If .env sets JUDGE_BASE_URL to http://localhost:..., use
#     http://host.docker.internal:... there, or the container will look for the judge inside itself.
#   - Linux hosts: the container runs as uid 1000; the repo root must be writable by that uid.
#   - The API runs the INSTALLED package (`--app-dir /app` keeps the mounted /work/ragregress source off the
#     import path), exactly like the CLI entrypoint. After editing code: docker compose build.
name: ragregress

x-common: &common
  build:
    context: .
  image: ragregress:local
  working_dir: /work
  init: true
  environment:
    OLLAMA_HOST: http://host.docker.internal:11434
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - .:/work
    - chroma_index:/work/artifacts/chroma
    - hf_cache:/hf-cache

services:
  api:
    <<: *common
    entrypoint: ["uvicorn"]
    command: ["ragregress.main:app", "--app-dir", "/app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: "no"

  ragregress:
    <<: *common
    profiles: ["cli"]

volumes:
  chroma_index:
  hf_cache: